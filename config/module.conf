# Настройки модуля dnscrypt-proxy-android.
# Файл читается при старте; после правки: dnscrypt-ctl restart

# Перехват IPv4-запросов на порт 53 (основной режим работы).
redirect_ipv4=true

# IPv6: auto - перехватывать, если ядро умеет ip6tables nat, иначе не трогать;
# redirect - требовать перехват; off - оставить IPv6-DNS системе.
# Глобального отключения IPv6 здесь нет намеренно: оно ломает раздачу Wi-Fi.
redirect_ipv6=auto

# Заворачивать ли DNS клиентов хотспота/USB-тизеринга.
# По умолчанию выключено: их запросы и так проходят через системный резолвер,
# а правила в PREROUTING - главный подозреваемый в поломках раздачи.
tether_redirect=false

# Выключать системный Private DNS (DoT мимо порта 53 модулю не перехватить).
disable_private_dns=true

# Держать копию конфига в /storage/emulated/0/dnscrypt-proxy для правки
# файловым менеджером. Более свежий файл выигрывает при синхронизации.
mirror_config=true

# Потолок паузы между перезапусками упавшего прокси, секунды.
restart_delay_max=60
