# Настройки модуля dnscrypt-proxy-android.
# Файл читается при старте; после правки: dnscrypt-ctl restart

# Запускаться при загрузке устройства. false оставляет модуль
# установленным, но при загрузке он ничего не поднимает и правил не ставит;
# запустить можно вручную: dnscrypt-ctl start или из приложения.
autostart=true

# Перехват IPv4-запросов на порт 53 (основной режим работы).
redirect_ipv4=true

# IPv6: auto - перехватывать, если ядро умеет ip6tables nat; если не умеет,
# блокировать DNS на IPv6-адреса, пока есть IPv4 (система уйдёт на IPv4-DNS,
# который перехватывается). В IPv6-only сети блокировка снимается сама.
# redirect - то же, но блокировать всегда; off - оставить IPv6-DNS системе
# (запросы на IPv6-DNS сети пойдут мимо прокси).
# Глобального отключения IPv6 здесь нет намеренно: оно ломает раздачу Wi-Fi.
redirect_ipv6=auto

# Заворачивать ли DNS клиентов хотспота/USB-тизеринга.
# По умолчанию выключено: их запросы и так проходят через системный резолвер,
# а правила в PREROUTING - главный подозреваемый в поломках раздачи.
tether_redirect=false

# Выключать системный Private DNS (DoT мимо порта 53 модулю не перехватить).
disable_private_dns=true

# Потолок паузы между перезапусками упавшего прокси, секунды.
restart_delay_max=60

# Запускать dnscrypt-proxy с этой первичной группой (имя или GID).
# Нужно только при box_for_magisk: он пропускает мимо прокси трафик
# с владельцем root:net_admin, поэтому run_gid=net_admin выводит
# запросы dnscrypt-proxy из-под перехвата box. Пусто = обычный запуск.
run_gid=""
